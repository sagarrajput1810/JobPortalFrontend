<div class="min-h-screen w-full flex flex-col md:flex-row bg-white dark:bg-gray-950 transition-colors duration-700 select-none overflow-hidden" (dblclick)="toggleTheme()">
  <!-- Left Side: Dynamic Image Background -->
  <div class="relative hidden md:flex md:w-1/2 lg:w-3/5 overflow-hidden bg-gray-100 dark:bg-gray-900 items-center justify-center">
    <!-- Light Mode Image -->
    <img src="https://images.unsplash.com/photo-1596524430615-b46475ddff6e?q=80&w=2070&auto=format&fit=crop" 
         class="absolute inset-0 w-full h-full object-cover transition-opacity duration-700 dark:opacity-0" 
         alt="Email Security Light">
    <!-- Dark Mode Image -->
    <img src="https://images.unsplash.com/photo-1563986768609-322da13575f3?q=80&w=2070&auto=format&fit=crop" 
         class="absolute inset-0 w-full h-full object-cover opacity-0 transition-opacity duration-700 dark:opacity-60" 
         alt="Digital Security Dark">
    
    <div class="absolute inset-0 bg-white/10 dark:bg-gradient-to-br dark:from-indigo-900/40 dark:to-black/60"></div>
    
    <div class="relative z-10 p-12 flex flex-col items-start justify-center text-left max-w-xl">
      <div class="w-16 h-1 bg-indigo-600 dark:bg-indigo-400 mb-8 rounded-full"></div>
      <h1 class="text-6xl font-black mb-6 leading-tight tracking-tighter text-gray-900 dark:text-white">
        Secure Your <br/>
        <span class="text-indigo-600 dark:text-indigo-400 font-black">Account.</span>
      </h1>
      <p class="text-xl font-medium text-gray-700 dark:text-gray-300 leading-relaxed">
        We've sent a verification code to your email. Please enter it to activate your professional profile.
      </p>
    </div>
  </div>

  <!-- Right Side: OTP Form -->
  <div class="flex-1 flex flex-col justify-center items-center p-6 sm:p-12 md:p-16 relative bg-white dark:bg-gray-950 transition-colors duration-700">
    <!-- Decorative Blobs -->
    <div class="absolute top-0 right-0 w-96 h-96 rounded-full bg-indigo-500/10 dark:bg-indigo-600/5 blur-[100px] pointer-events-none"></div>
    <div class="absolute bottom-0 left-0 w-80 h-80 rounded-full bg-purple-500/10 dark:bg-purple-600/5 blur-[100px] pointer-events-none"></div>

    <div class="w-full max-w-md relative z-10 space-y-8">
      <div class="text-left">
        <h2 class="text-4xl font-extrabold text-gray-900 dark:text-white tracking-tight">Verify Email</h2>
        <p class="mt-3 text-gray-500 dark:text-gray-400 font-medium">
          An OTP has been sent to <span class="text-indigo-600 dark:text-indigo-400 font-bold">{{ email }}</span>
        </p>
      </div>

      <form (submit)="onVerify()" #verifyForm="ngForm" class="space-y-6">
        <div class="space-y-2">
          <label for="otp" class="text-sm font-bold text-gray-700 dark:text-gray-300 tracking-wide uppercase">Enter 6-Digit OTP</label>
          <input type="text" id="otp" name="otp" [(ngModel)]="otp" required maxlength="6" placeholder="0 0 0 0 0 0"
            class="w-full px-5 py-5 bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800 rounded-2xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all text-gray-900 dark:text-white placeholder-gray-400 text-center text-3xl tracking-[1em] font-black">
        </div>

        <div *ngIf="errorMessage()" class="p-4 bg-red-50 dark:bg-red-900/20 border-l-4 border-red-500 rounded-xl">
          <p class="text-sm text-red-700 dark:text-red-400 font-semibold">{{ errorMessage() }}</p>
        </div>
        <div *ngIf="successMessage()" class="p-4 bg-green-50 dark:bg-green-900/20 border-l-4 border-green-500 rounded-xl">
          <p class="text-sm text-green-700 dark:text-green-400 font-semibold">{{ successMessage() }}</p>
        </div>

        <button type="submit" [disabled]="!verifyForm.form.valid || isLoading()"
          class="w-full py-4 px-6 rounded-2xl shadow-xl shadow-indigo-500/20 text-lg font-bold text-white bg-indigo-600 hover:bg-indigo-700 active:scale-[0.98] transition-all transform disabled:opacity-50 flex items-center justify-center">
          <span *ngIf="isLoading()" class="mr-2">
            <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
          </span>
          {{ isLoading() ? 'Verifying...' : 'Confirm Verification' }}
        </button>

        <p class="text-center text-gray-600 dark:text-gray-400 font-medium">
          Didn't receive the code? 
          <a href="#" class="text-indigo-600 dark:text-indigo-400 hover:text-indigo-700 font-bold decoration-2 underline-offset-4 hover:underline transition-all">Resend OTP</a>
        </p>
        
        <p class="text-center text-sm">
          <a routerLink="/register" class="text-gray-500 hover:text-gray-700 dark:hover:text-gray-300 transition-colors">Back to Registration</a>
        </p>
      </form>
    </div>
  </div>
</div>
