<div class="flex items-center justify-center min-h-screen bg-gray-100">
  <div class="w-full max-w-md p-8 space-y-8 bg-white rounded shadow-lg">
    <h2 class="text-3xl font-bold text-center">Login</h2>
    <form (submit)="onLogin()" #loginForm="ngForm" class="space-y-6">
      <div>
        <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
        <input type="email" id="email" name="email" [(ngModel)]="credentials.email" required
          class="w-full px-3 py-2 mt-1 border border-gray-300 rounded focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
      </div>
      <div>
        <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
        <input type="password" id="password" name="password" [(ngModel)]="credentials.password" required
          class="w-full px-3 py-2 mt-1 border border-gray-300 rounded focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
      </div>
      <div *ngIf="errorMessage()" class="text-sm text-red-600 text-center">
        {{ errorMessage() }}
      </div>
      <button type="submit" [disabled]="!loginForm.form.valid"
        class="w-full px-4 py-2 text-white bg-indigo-600 rounded hover:bg-indigo-700 disabled:opacity-50">
        Sign in
      </button>
      <p class="text-sm text-center">
        Don't have an account? <a routerLink="/register" class="text-indigo-600 hover:underline">Register</a>
      </p>
    </form>
  </div>
</div>
