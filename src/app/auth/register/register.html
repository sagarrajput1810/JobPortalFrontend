<div class="flex items-center justify-center min-h-screen bg-gray-100">
  <div class="w-full max-w-md p-8 space-y-8 bg-white rounded shadow-lg">
    <h2 class="text-3xl font-bold text-center">Register</h2>
    <form (submit)="onRegister()" #registerForm="ngForm" class="space-y-4">
      <div>
        <label for="fullName" class="block text-sm font-medium text-gray-700">Full Name</label>
        <input type="text" id="fullName" name="fullName" [(ngModel)]="userData.fullName" required
          class="w-full px-3 py-2 mt-1 border border-gray-300 rounded focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
      </div>
      <div>
        <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
        <input type="email" id="email" name="email" [(ngModel)]="userData.email" required
          class="w-full px-3 py-2 mt-1 border border-gray-300 rounded focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
      </div>
      <div>
        <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
        <input type="password" id="password" name="password" [(ngModel)]="userData.password" required
          class="w-full px-3 py-2 mt-1 border border-gray-300 rounded focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700">Register as</label>
        <select name="role" [(ngModel)]="userData.role" class="w-full px-3 py-2 mt-1 border border-gray-300 rounded">
          <option value="Candidate">Candidate</option>
          <option value="Recruiter">Recruiter</option>
        </select>
      </div>

      <div *ngIf="errorMessage()" class="text-sm text-red-600 text-center">
        {{ errorMessage() }}
      </div>
      <div *ngIf="successMessage()" class="text-sm text-green-600 text-center">
        {{ successMessage() }}
      </div>

      <button type="submit" [disabled]="!registerForm.form.valid"
        class="w-full px-4 py-2 text-white bg-indigo-600 rounded hover:bg-indigo-700 disabled:opacity-50">
        Sign up
      </button>
      <p class="text-sm text-center">
        Already have an account? <a routerLink="/login" class="text-indigo-600 hover:underline">Login</a>
      </p>
    </form>
  </div>
</div>
