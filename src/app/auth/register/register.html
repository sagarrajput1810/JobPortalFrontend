<div class="min-h-screen w-full flex flex-col md:flex-row bg-white dark:bg-gray-950 transition-colors duration-700 select-none overflow-hidden" (dblclick)="toggleTheme()">
  <!-- Left Side: Dynamic Image Background -->
  <div class="relative hidden md:flex md:w-1/2 lg:w-3/5 overflow-hidden bg-gray-100 dark:bg-gray-900 items-center justify-center order-1 md:order-2">
    <!-- Light Mode Image -->
    <img src="https://images.unsplash.com/photo-1556761175-b413da4baf72?q=80&w=2074&auto=format&fit=crop" 
         class="absolute inset-0 w-full h-full object-cover transition-opacity duration-700 dark:opacity-0" 
         alt="Team Collaboration Light">
    <!-- Dark Mode Image -->
    <img src="https://images.unsplash.com/photo-1522071820081-009f0129c71c?q=80&w=2070&auto=format&fit=crop" 
         class="absolute inset-0 w-full h-full object-cover opacity-0 transition-opacity duration-700 dark:opacity-60" 
         alt="Team Meeting Dark">
    
    <div class="absolute inset-0 bg-white/10 dark:bg-gradient-to-br dark:from-blue-900/40 dark:to-black/60"></div>
    
    <div class="relative z-10 p-12 flex flex-col items-start justify-center text-left max-w-xl">
      <div class="w-16 h-1 bg-blue-600 dark:bg-blue-400 mb-8 rounded-full"></div>
      <h1 class="text-6xl font-black mb-6 leading-tight tracking-tighter text-gray-900 dark:text-white">
        Join the <br/>
        <span class="text-blue-600 dark:text-blue-400 font-black">Talent Network.</span>
      </h1>
      <p class="text-xl font-medium text-gray-700 dark:text-gray-300 leading-relaxed">
        We bridge the gap between extraordinary talent and world-class opportunities. Your next big break is just a click away.
      </p>
    </div>
  </div>

  <!-- Right Side: Registration Form -->
  <div class="flex-1 flex flex-col justify-center items-center p-6 sm:p-12 md:p-16 relative bg-white dark:bg-gray-950 transition-colors duration-700 order-2 md:order-1">
    <!-- Decorative Blobs -->
    <div class="absolute top-0 left-0 w-96 h-96 rounded-full bg-blue-500/10 dark:bg-blue-600/5 blur-[100px] pointer-events-none"></div>
    <div class="absolute bottom-0 right-0 w-80 h-80 rounded-full bg-teal-500/10 dark:bg-teal-600/5 blur-[100px] pointer-events-none"></div>

    <div class="w-full max-w-md relative z-10 space-y-6">
      <div class="text-left">
        <h2 class="text-4xl font-extrabold text-gray-900 dark:text-white tracking-tight">Create Account</h2>
        <p class="mt-3 text-gray-500 dark:text-gray-400 font-medium">Start your professional journey with us.</p>
      </div>

      <form (submit)="onRegister()" #registerForm="ngForm" class="space-y-4">
        <!-- Full Name -->
        <div class="space-y-1">
          <label for="fullName" class="text-xs font-bold text-gray-700 dark:text-gray-300 tracking-widest uppercase">Full Name</label>
          <input type="text" id="fullName" name="fullName" [(ngModel)]="userData.fullName" required placeholder="John Doe"
            class="w-full px-5 py-3.5 bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800 rounded-2xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all text-gray-900 dark:text-white placeholder-gray-400">
        </div>

        <!-- Email -->
        <div class="space-y-1">
          <label for="email" class="text-xs font-bold text-gray-700 dark:text-gray-300 tracking-widest uppercase">Email</label>
          <input type="email" id="email" name="email" [(ngModel)]="userData.email" required placeholder="john@example.com"
            class="w-full px-5 py-3.5 bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800 rounded-2xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all text-gray-900 dark:text-white placeholder-gray-400">
        </div>

        <!-- Password -->
        <div class="space-y-1">
          <label for="password" class="text-xs font-bold text-gray-700 dark:text-gray-300 tracking-widest uppercase">Password</label>
          <input type="password" id="password" name="password" [(ngModel)]="userData.password" required placeholder="••••••••"
            class="w-full px-5 py-3.5 bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800 rounded-2xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all text-gray-900 dark:text-white placeholder-gray-400">
        </div>

        <!-- Role Selection -->
        <div class="space-y-1">
          <label class="text-xs font-bold text-gray-700 dark:text-gray-300 tracking-widest uppercase">I am a</label>
          <select name="role" [(ngModel)]="userData.role" 
            class="w-full px-5 py-3.5 bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800 rounded-2xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all text-gray-900 dark:text-white appearance-none cursor-pointer">
            <option value="Candidate">Candidate (Job Seeker)</option>
            <option value="Recruiter">Recruiter (Hiring Manager)</option>
          </select>
        </div>

        <div *ngIf="errorMessage()" class="p-3 bg-red-50 dark:bg-red-900/20 border-l-4 border-red-500 rounded-xl">
          <p class="text-sm text-red-700 dark:text-red-400 font-semibold">{{ errorMessage() }}</p>
        </div>
        <div *ngIf="successMessage()" class="p-3 bg-green-50 dark:bg-green-900/20 border-l-4 border-green-500 rounded-xl">
          <p class="text-sm text-green-700 dark:text-green-400 font-semibold">{{ successMessage() }}</p>
        </div>

        <button type="submit" [disabled]="!registerForm.form.valid"
          class="w-full py-4 px-6 mt-4 rounded-2xl shadow-xl shadow-blue-500/20 text-lg font-bold text-white bg-blue-600 hover:bg-blue-700 active:scale-[0.98] transition-all transform disabled:opacity-50">
          Create Account
        </button>

        <p class="text-center text-gray-600 dark:text-gray-400 font-medium">
          Already have an account? 
          <a routerLink="/login" class="text-blue-600 dark:text-blue-400 hover:text-blue-700 font-bold decoration-2 underline-offset-4 hover:underline transition-all">Sign In</a>
        </p>
      </form>
    </div>
  </div>
</div>
